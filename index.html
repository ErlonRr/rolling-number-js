<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c11" />
    <meta
      name="description"
      content="Rolling Number: a zero-dependency animated odometer counter for any element — Web Component, vanilla JS, React, Vue, Angular and Svelte. Live playground, examples and framework guides."
    />
    <title>Rolling Number</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a stored theme before the first paint (main.js keeps it in sync afterwards).
      try {
        var theme = localStorage.getItem('rn-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        }
      } catch (error) {
        // Storage blocked: follow the system theme.
      }
    </script>
    <!-- A link, not a JS import: the stylesheet blocks the first paint in dev too (no unstyled flash). -->
    <link rel="stylesheet" href="/demo/styles.css" />
    <script type="module" src="/demo/main.js"></script>
  </head>
