# CI of rolling-number (docs/design/v1.3.md §11 WP11 "CI"; owned by WP5).
#
# Jobs
# - check:  every push and PR, Node 20 and 22: the whole prepublish pipeline
#           plus the Vue template types and the size gate.
# - visual: every push and PR: Playwright on Chromium, Firefox and WebKit.
# - compat: nightly, on demand, and on PRs labeled `release`: the test suites
#           against other framework versions (React 18/19, Vue 3.3/3.5,
#           Angular 16.x and latest).
#
# Pieces that land in later work packages are detected and skipped until then:
# - `check:vue-types` needs tests/vue-types/ (WP9);
# - `test:visual` needs tests/visual/*.spec.ts (WP11).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '17 3 * * *' # nightly compat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref and event kind; a new push cancels the previous run.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

env:
  # Matches the local toolchain (pnpm-lock.yaml v9, `allowBuilds` in
  # pnpm-workspace.yaml). Drop it if package.json gains a `packageManager` field.
  PNPM_VERSION: 12

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    # Labeling a PR only (re)starts `compat`.
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          # pnpm runs on its own bundled Node, whatever node-version is tested.
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Before `test`: a few tests read dist/.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm smoke
      - run: pnpm check:ng-aot
      - name: pnpm check:vue-types
        # tests/vue-types (Fixture.vue + tsconfig) is added by WP9.
        if: hashFiles('tests/vue-types/tsconfig.json') != ''
        run: pnpm check:vue-types
      - run: pnpm lint:pkg
      # Fails over the docs/design/v1.3.md §10 budgets; the table goes to the job summary.
      - run: pnpm size

  visual:
    name: visual (Playwright)
    if: github.event_name != 'schedule' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check the visual harness and specs
        run: pnpm exec tsc -p tests/visual/tsconfig.json
      - name: Detect visual specs
        id: specs
        run: |
          if ls tests/visual/*.spec.ts > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tests/visual/*.spec.ts yet (added by WP11): the visual suite is skipped."
          fi
      - name: Playwright version
        id: playwright
        if: steps.specs.outputs.present == 'true'
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        if: steps.specs.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers
        if: steps.specs.outputs.present == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Playwright system dependencies (browsers cached)
        if: steps.specs.outputs.present == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - name: Build the package and the demo
        if: steps.specs.outputs.present == 'true'
        run: pnpm build && pnpm build:demo
      - name: pnpm test:visual
        if: steps.specs.outputs.present == 'true'
        # Already built: playwright.config.ts only starts the preview server.
        env:
          RN_VISUAL_SERVER: pnpm preview --port 4173 --strictPort
        run: pnpm test:visual
      - name: Upload the Playwright report
        if: failure() && steps.specs.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  compat:
    name: compat (${{ matrix.name }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'release') &&
        (github.event.action != 'labeled' || github.event.label.name == 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # React / Vue: override the devDependencies, then build and run the unit tests.
          - name: React 18
            kind: react
            add: react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18
          - name: React 19
            kind: react
            add: react@^19 react-dom@^19 @types/react@^19 @types/react-dom@^19
          - name: Vue 3.3
            kind: vue
            add: vue@~3.3.0
          - name: Vue 3.5
            kind: vue
            add: vue@~3.5.0
          # Angular: the library is built with the pinned toolchain (Angular 18,
          # TypeScript ~5.5), packed, and the ng-aot fixture (ngc strictTemplates
          # + linker) then runs with the consumer's Angular version.
          - name: Angular 16
            kind: angular
            ng: '^16'
          - name: Angular latest
            kind: angular
            ng: latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --- React / Vue
      - name: Override ${{ matrix.name }}
        if: matrix.kind != 'angular'
        run: pnpm add -D ${{ matrix.add }}
      - name: Build
        run: pnpm build
      - name: Unit and type tests
        if: matrix.kind != 'angular'
        run: pnpm test
      - name: pnpm check:vue-types
        # tests/vue-types is added by WP9.
        if: matrix.kind == 'vue' && hashFiles('tests/vue-types/tsconfig.json') != ''
        run: pnpm check:vue-types

      # --- Angular
      - name: Pack, and test the packed files instead of dist/
        if: matrix.kind == 'angular'
        run: |
          mkdir -p .compat
          pnpm pack --pack-destination .compat
          tar -xzf .compat/rolling-number-*.tgz -C .compat
          rm -rf dist
          cp -R .compat/package/dist dist
      - name: Override Angular (${{ matrix.ng }}) with a matching TypeScript and zone.js
        if: matrix.kind == 'angular'
        run: |
          NG=$(npm view "@angular/compiler-cli@${{ matrix.ng }}" version --json | node -p "[].concat(JSON.parse(require('fs').readFileSync(0, 'utf8'))).pop()")
          TS=$(npm view "@angular/compiler-cli@$NG" peerDependencies --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).typescript")
          ZONE=$(npm view "@angular/core@$NG" peerDependencies --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))['zone.js'] || 'latest'")
          echo "Angular $NG, typescript@$TS, zone.js@$ZONE"
          pnpm add -D "@angular/core@$NG" "@angular/common@$NG" "@angular/compiler@$NG" "@angular/compiler-cli@$NG" "typescript@$TS" "zone.js@$ZONE"
      - name: ng-aot fixture against the packed package
        if: matrix.kind == 'angular'
        run: pnpm check:ng-aot
