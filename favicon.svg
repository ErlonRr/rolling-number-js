<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Base Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2" />
  
  <!-- Outer Slot Machine Frame Window -->
  <rect x="14" y="12" width="36" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Motion Blur Slot Lines -->
  <line x1="20" y1="18" x2="44" y2="18" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.4" />
  <line x1="20" y1="46" x2="44" y2="46" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Rolling Digit "7" -->
  <text x="32" y="39" 
        font-family="'JetBrains Mono', 'Outfit', monospace, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="url(#accentGrad)" 
        text-anchor="middle" 
        letter-spacing="-1">7</text>
</svg>
