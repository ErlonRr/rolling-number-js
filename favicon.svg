<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- An odometer reel: 6 / 7 / 8, the same mark as the demo header. -->
  <rect width="32" height="32" rx="9" fill="#4f46e5" />
  <g fill="#fff" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">
    <text x="16" y="6" font-size="11" fill-opacity="0.35">6</text>
    <text x="16" y="21.5" font-size="16">7</text>
    <text x="16" y="34" font-size="11" fill-opacity="0.35">8</text>
  </g>
</svg>
